name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: type-check + Jest + build ──────────────────────────────────
  frontend:
    name: Frontend (typecheck + jest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Jest unit tests
        run: npm test -- --passWithNoTests --watchAll=false

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Backend: pytest + image generation tests ─────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start Docker services
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API ready."
              break
            fi
            echo "  Attempt $i/24 — sleeping 5s..."
            sleep 5
          done

      - name: Run all API tests
        run: docker compose exec -T api python -m pytest tests/ -v --tb=short

      - name: Run image generation tests
        run: docker compose exec -T api python -m pytest tests/test_image_generation.py -v --tb=short

      - name: Frontend HTTP health check
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 16); do
            STATUS=$(docker compose exec -T web node -e \
              "require('http').get('http://localhost:3000',r=>{process.stdout.write(String(r.statusCode));process.exit(0)}).on('error',()=>process.exit(1))" 2>/dev/null || echo "err")
            if [ "$STATUS" = "200" ]; then
              echo "Frontend OK — HTTP 200"
              exit 0
            fi
            echo "  Attempt $i/16 — waiting 5s..."
            sleep 5
          done
          echo "FAIL: Frontend did not respond with 200 after 80s"
          docker compose logs web --tail=30
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=50
